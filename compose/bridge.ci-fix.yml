# Fixes applied on top of cads-bridge docker-compose.ci-override.yml for journey-tests CI.
# - ASPNETCORE_URLS must not include literal quote characters
# - Keep a stable host port mapping for debugging
# - Ensure the shared network is attached by exact name
services:
  cads_bridge:
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5550
    ports:
      - '5550:5550'
    networks:
      - cads-network

networks:
  cads-network:
    external: true
    name: cads-network
