name: Run Journey Tests (GitHub)

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Choose test suite"
        type: choice
        required: false
        default: ""
        options:
          - ""
          - API
          - UI
      tag:
        description: "Choose test group"
        type: choice
        required: false
        default: ""
        options:
          - ""
          - Smoke
          - E2E
      branch-set:
        description: "Which branch set to test (develop or main)"
        type: choice
        required: false
        default: develop
        options:
          - develop
          - main

  workflow_call:
    inputs:
      test:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""
      branch-set:
        required: false
        type: string
        default: develop
      slack-webhook-url:
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Checkout all 4 required repositories
      - name: Checkout cads-tools
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-tools
          ref: ${{ inputs.branch-set == 'main' && 'main' || 'main' }}
          path: cads-tools

      - name: Checkout cads-bridge
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-bridge
          ref: main
          path: cads-bridge

      - name: Checkout cads-data-seed
        uses: actions/checkout@v4.2.0
        if: ${{ false }} # disabled
        with:
          repository: DEFRA/cads-data-seed
          path: cads-data-seed
          ref: main
          token: ${{ secrets.CADS_DATA_SEED_PAT_TOKEN }}

      - name: Checkout cads-data-service
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-data-service
          ref: ${{ inputs.branch-set == 'main' && 'main' || 'develop' }}
          path: cads-data-service

      - name: Checkout cads-mis
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-mis
          ref: ${{ inputs.branch-set == 'main' && 'main' || 'develop' }}
          path: cads-mis

      - name: Checkout cads-journey-tests
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-journey-tests
          ref: ${{ inputs.branch-set == 'main' && 'main' || github.ref }}
          path: cads-journey-tests

      - name: Fix permissions for platform scripts
        run: |
          chmod -R +x cads-tools/**/*.sh || true
          chmod -R +x cads-data-service/**/*.sh || true
          chmod -R +x cads-mis/**/*.sh || true
          chmod -R +x cads-journey-tests/**/*.sh || true

      - name: Copy frontend.env into cads-mis
        run: |
          mkdir -p cads-mis/compose
          cp cads-journey-tests/compose/frontend.env cads-mis/compose/frontend.env

      # Create cads-tools network early (other projects reference as external)
      - name: Ensure cads-network exists
        run: |
          if ! docker network inspect cads-network >/dev/null 2>&1; then
            docker network create \
              --label com.docker.compose.network=cads-network \
              cads-network
          fi

      # FIX: Set ROOT_DIR so Localstack init scripts mount correctly
      - name: Set ROOT_DIR for compose mounts
        run: echo "ROOT_DIR=${{ github.workspace }}/cads-tools" >> $GITHUB_ENV

      # Start platform (tools + backend + UI)
      - name: Start platform
        working-directory: cads-journey-tests/bin
        run: |
          chmod +x platform.sh
          ./platform.sh up

      - name: Wait for platform to stabilise
        run: sleep 15

      - name: Seed SQL files into LocalStack S3
        if: ${{ false }} # disabled
        # if: ${{ hashFiles('cads-data-seed/sql/**/*.sql') != '' }}
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: eu-west-2
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: http://localhost:4566 # host -> mapped LocalStack port
          BUCKET: cads-internal-bucket
        run: |
          set -euo pipefail
          echo "[seed] Ensuring bucket ${BUCKET} exists..."
          aws --endpoint-url "${ENDPOINT}" --no-sign-request \
            s3 mb "s3://${BUCKET}" 2>/dev/null || true

          echo "[seed] Syncing SQL seed data into LocalStack S3..."
          aws --endpoint-url "${ENDPOINT}" s3 sync cads-data-seed/sql "s3://${BUCKET}/sql" \
            --exclude "*" \
            --include "*.sql" \
            --delete \
            --no-sign-request

          echo "[seed] Files in bucket:"
          aws --endpoint-url "${ENDPOINT}" s3 ls "s3://${BUCKET}/sql/" --recursive

      - name: List running containers
        run: docker ps -a

      - name: Debug localstack
        if: always()
        run: docker logs cads-localstack || true
      - name: Debug LocalStack init (host)
        if: always()
        run: ls -R $ROOT_DIR/infra/localstack/init
      - name: Debug LocalStack init (container)
        if: always()
        run: docker exec cads-localstack ls -R /etc/localstack/init/ready.d || true

      - name: Debug Backend logs
        run: docker logs cads_cds || true
      - name: Debug Backend health endpoint debug
        run: docker compose -p cads exec -T cads_cds curl -v http://localhost:5555/health

      - name: Ensure report directories exist
        run: |
          mkdir -p cads-journey-tests/allure-report
          mkdir -p cads-journey-tests/playwright-report

      - name: Run journey-tests inside Docker
        working-directory: cads-journey-tests
        env:
          TEST_INPUT: ${{ inputs.test }}
          TAG_INPUT: ${{ inputs.tag }}
          AUTH_BASIC_TOKEN: ${{ secrets.AUTH_BASIC_TOKEN }}
        run: |
          FILTER=""

          if [[ -n "$TEST_INPUT" ]]; then
            FILTER="@$TEST_INPUT"
          fi

          if [[ -n "$TAG_INPUT" ]]; then
            if [[ -n "$FILTER" ]]; then
              FILTER="@$FILTER,@$TAG_INPUT"
            else
              FILTER="@$TAG_INPUT"
            fi
          fi

          echo "Running tests with filter: $FILTER"

          if [[ -z "$FILTER" ]]; then
            docker compose -p cads -f docker-compose.yml up --build --abort-on-container-exit
          else
            docker compose -p cads -f docker-compose.yml run --rm --build journey-tests \
              sh -c "npm ci && npx playwright test --grep='$FILTER'"
          fi

      - name: Debug Inspect cads-network network
        if: always()
        run: docker network inspect cads-network

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: cads-journey-tests/allure-results
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: cads-journey-tests/playwright-report/html
          if-no-files-found: ignore

      - name: Collect Docker logs
        if: always()
        run: |
          echo "Docker container logs" > logs.txt
          echo "=====================" >> logs.txt
          docker ps -a >> logs.txt

          for c in $(docker ps -a --format "{{.Names}}"); do
            echo "=====================" >> logs.txt
            echo "CONTAINER: $c" >> logs.txt
            echo "=====================" >> logs.txt
            docker logs $c >> logs.txt 2>&1 || true
          done

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs.txt

      # Stop platform (tools + backend + UI)
      - name: Stop platform
        if: always()
        working-directory: cads-journey-tests/bin
        run: ./platform.sh down

      - name: Post Slack report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: cads-journey-tests
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "Slack webhook not provided; skipping"
            exit 0
          fi
          node post-slack-report.mjs
