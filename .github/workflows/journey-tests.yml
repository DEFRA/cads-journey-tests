name: Run Journey Tests

on:  

  workflow_dispatch:
    inputs:
      test:
        description: "Choose test suite"
        type: choice
        required: false
        default: ''
        options:
          - ''
          - API
          - UI
      tag:
        description: "Choose test group"
        type: choice
        required: false
        default: ''
        options:
          - ''
          - Smoke
          - E2E
      branch-set:
        description: "Which branch set to test (develop or main)"
        type: choice
        required: false
        default: develop
        options:
          - develop
          - main

  workflow_call:
    inputs:
      test:
        required: false
        type: string
        default: ''
      tag:
        required: false
        type: string
        default: ''
      slack-webhook-url:
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # Checkout all 4 required repositories
      - name: Checkout cads-tools
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-tools
          ref: ${{ inputs.branch-set == 'main' && 'main' || 'main' }}
          path: cads-tools

      - name: Checkout cads-data-service
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-data-service
          ref: ${{ inputs.branch-set == 'main' && 'main' || 'develop' }}
          path: cads-data-service

      - name: Checkout cads-mis
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-mis
          ref: ${{ inputs.branch-set == 'main' && 'main' || 'develop' }}
          path: cads-mis

      - name: Checkout cads-journey-tests
        uses: actions/checkout@v4.2.0
        with:
          repository: DEFRA/cads-journey-tests
          ref: ${{ inputs.branch-set == 'main' && 'main' || github.ref }}
          path: cads-journey-tests

      # Shell script permissions
      - name: Fix permissions for platform scripts
        run: |
          chmod -R +x cads-tools/**/*.sh || true
          chmod -R +x cads-data-service/**/*.sh || true
          chmod -R +x cads-mis/**/*.sh || true
          chmod -R +x cads-journey-tests/**/*.sh || true

      # Create cads-tools network early (other projects reference as external)
      - name: Ensure cads-tools network exists
        run: |
          if ! docker network inspect cads-tools >/dev/null 2>&1; then
            docker network create \
              --label com.docker.compose.network=cads-tools \
              cads-tools
          fi

      # Debug networks
      - name: Debug networks
        run: docker network ls

      # Start platform (tools + backend + UI)
      - name: Start platform
        working-directory: cads-journey-tests/bin
        run: |
          chmod +x platform.sh
          ./platform.sh up

      # Allow for time for DB migrations etc
      - name: Wait for platform to stabilise
        run: sleep 15

      # Run journey-tests inside Docker
      - name: Run journey tests
        working-directory: cads-journey-tests
        env:
          TEST_INPUT: ${{ inputs.test }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          FILTER=""

          if [[ -n "$TEST_INPUT" ]]; then
            FILTER="$TEST_INPUT"
          fi

          if [[ -n "$TAG_INPUT" ]]; then
            if [[ -n "$FILTER" ]]; then
              FILTER="$FILTER|$TAG_INPUT"
            else
              FILTER="$TAG_INPUT"
            fi
          fi

          echo "Running tests with filter: $FILTER"

          if [[ -z "$FILTER" ]]; then
            docker compose -f docker-compose.yml up --build --abort-on-container-exit
          else
            docker compose -f docker-compose.yml run --rm --build journey-tests npx playwright test --grep="$FILTER"
          fi
        
      # Debug networks
      - name: Inspect cads-tools network
        if: always()
        run: docker network inspect cads-tools
      
      # Upload Allure report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: cads-journey-tests/allure-report

      # Upload Playwright report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: cads-journey-tests/playwright-report
          if-no-files-found: ignore

      # Upload Docker logs
      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            cads-tools/harness/logs
            cads-data-service/platform/logs
            cads-mis/logs
            cads-journey-tests/logs
          if-no-files-found: ignore

      # Stop journey tests containers
      - name: Stop journey-tests containers
        if: always()
        working-directory: cads-journey-tests
        run: docker compose down || true

      # Stop platform (tools + backend + UI)
      - name: Stop platform
        if: always()
        working-directory: cads-journey-tests/bin
        run: ./platform.sh down

      # Slack notification
      - name: Post Slack Report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: cads-journey-tests
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "Slack webhook not provided; skipping"
            exit 0
          fi
          node post-slack-report.mjs
