name: Run Journey Tests

permissions:
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      cads-frontend:
        description: "CADS frontend image tag"
        required: false
        type: string
        default: latest
      cads-backend:
        description: "CADS backend image tag"
        required: false
        type: string
        default: latest
      test:
        description: "Choose Test Suite"
        type: choice
        required: false
        default: ''
        options:
          - ''
          - API
          - UI
      tag:
        description: "Choose Test Group"
        type: choice
        required: false
        default: ''
        options:
          - ''
          - Smoke
          - E2E

  workflow_call:
    inputs:
      cads-frontend:
        required: false
        type: string
        default: latest
      cads-backend:
        required: false
        type: string
        default: latest
      test:
        required: false
        type: string
        default: ''
      tag:
        required: false
        type: string
        default: ''
      slack-webhook-url:
        required: false
        type: string
jobs:
  build:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - uses: ./run-journey-tests
        with:
          cads-frontend: ${{ inputs.cads-frontend }}
          cads-backend: ${{ inputs.cads-backend }}
          test: ${{ inputs.test }}
          tag: ${{ inputs.tag }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}