name: Run Journey Tests (CDP)

inputs:
  test:
    description: "Choose Test suite"
    type: choice
    required: false
    default: ''
    options:
      - API
      - UI
  tag:
    description: "Choose test group"
    type: choice
    required: false
    default: ''
    options:
      - Smoke
      - E2E
  environment:
    description: "Environment used by the Playwright tests"
    required: false
    default: dev

  slack-webhook-url:
    required: false

runs:
  using: "composite"
  steps:
    
    # Checkout the journey-tests repo
    - uses: actions/checkout@v4
      with:
        repository: DEFRA/cads-journey-tests
        path: cads-journey-tests

    # Setup Node
    - uses: actions/setup-node@v4
      with:
        node-version-file: cads-journey-tests/.nvmrc
        cache: npm

    # Install dependencies
    - name: Install dependencies
      working-directory: cads-journey-tests
      run: npm ci
      shell: bash

    # Install Playwright browsers
    - name: Install Playwright browsers
      working-directory: cads-journey-tests
      run: npx playwright install --with-deps
      shell: bash

    # Debug environment variables injected by CDP
    - name: Show environment variables
      shell: bash
      run: |
        echo "UI:  $CADS_MIP_FRONTEND_BASE_URL"
        echo "API: $CADS_CDS_BACKEND_BASE_URL"
        echo "API EXT: $CADS_CDS_BACKEND_EXTERNAL_BASE_URL"

    # Run Playwright tests
    - name: Run tests
      working-directory: cads-journey-tests
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}   # CDP Portal will override this with dev/test/perf-test
      run: |
        FILTER=""
        if [[ -n "${{ inputs.test }}" ]]; then FILTER="@${{ inputs.test }}"; fi
        if [[ -n "${{ inputs.tag }}" ]]; then
          if [[ -n "$FILTER" ]]; then FILTER="(?=.*$FILTER)(?=.*@${{ inputs.tag }})"; else FILTER="@${{ inputs.tag }}"; fi
        fi
        echo "Running tests with filter: $FILTER"
        echo "Environment: $ENVIRONMENT"
        
        if [[ -z "$FILTER" ]]; then
          npx playwright test --config=playwright.config.ts
        else
          npx playwright test --config=playwright.config.ts --grep="$FILTER"
        fi
  
    # Upload Allure report
    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: cads-journey-tests/allure-report

    # Upload Playwright HTML report
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: cads-journey-tests/playwright-report/html

    # Slack notification
    - name: Post Slack Report
      if: always()
      working-directory: cads-journey-tests
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
          echo "Slack webhook not provided; skipping"
          exit 0
        fi
        node post-slack-report.mjs
