name: Run Journey Tests

inputs:
  cads-frontend:
    required: false
    type: string
  cads-backend:
    required: false
    type: string
  cads-environment:
    description: "Target environment"
    required: true
    type: choice
    default: docker
    options:
      - local
      - docker
      - dev
      - test
  test:
    description: "Choose Test Suite"
    type: choice
    required: true
    options:
      - API
      - UI
  tag:
    description: "Choose Test Group"
    type: choice
    required: true
    options:
      - Smoke
      - E2E
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        repository: DEFRA/cads-journey-tests

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
  
    - name: Setup the tests
      run: npm i
      shell: bash

    - name: Make LocalStack init script executable
      run: chmod +x ./docker/scripts/localstack/init/start-localstack.sh
      shell: bash

    - name: Start docker compose
      shell: bash
      run: |
        if [[ "${{ inputs.cads-environment }}" == "docker" ]]; then
          docker compose -f compose.common.yml -f compose.ci.yml up --wait-timeout 300 -d --quiet-pull
          docker ps --format "table {{.Names}}\t{{.Ports}}"
        fi
    - name: Run the tests
      shell: bash
      run: |
        npx playwright install --with-deps

        TEST_INPUT="${{ inputs.test }}"
        TAG_INPUT="${{ inputs.tag }}"

        FILTER=""

        if [[ -n "$TEST_INPUT" ]]; then
          FILTER="$TEST_INPUT"
        fi

        if [[ -n "$TAG_INPUT" ]]; then
          if [[ -n "$FILTER" ]]; then
            FILTER="$FILTER|$TAG_INPUT"
          else
            FILTER="$TAG_INPUT"
          fi
        fi

        echo "Environment: ${{ inputs.cads-environment }}"

        if [[ -z "$FILTER" ]]; then
          echo "No filters provided. Running all tests..."
          ENV=${{ inputs.cads-environment }} npx playwright test --config=playwright.config.ts
        else
          echo "Running filtered tests with grep: $FILTER"
          ENV=${{ inputs.cads-environment }} npx playwright test --config=playwright.config.ts --grep="$FILTER"
        fi
    - name: debug
      if: always()
      shell: bash
      run: |
        docker compose -f compose.common.yml -f compose.ci.yml logs > logs.txt
        docker ps
    #- name: Post Slack Report
    #  shell: bash
    #  run: |
    #    BUILD_URL="Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
    #    node post-slack-report.ts
    - name: Upload playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./playwright-report/html
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
