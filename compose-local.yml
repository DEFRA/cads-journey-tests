services:
  ################################################################################
  # All of the infrastructure services
  ################################################################################
  
  localstack:
    container_name: "cds-localstack-emulator"
    image: localstack/localstack:3.0.2
    ports:
      - '4566:4566' # LocalStack Gateway
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,firehose
      LOCALSTACK_HOST: 127.0.0.1    
    env_file:
      - ./dockerconfig/local-defaults.env
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'http://cds-localstack-emulator:4566/health']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdpnet
    
  ################################################################################

  postgres:
    image: postgres:16.6
    #environment:
    #  - POSTGRES_USER=${POSTGRES_USER}
    #  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    #  - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "./postgres-data:/var/lib/postgresql/data"
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./dockerconfig/postgres.env
    networks:
      - cdpnet

################################################################################

  #liquibase:
  #  build:
  #    context: .
  #    dockerfile_inline: |
  #      FROM liquibase/liquibase:5.0.1
  #      RUN lpm add postgresql --global
  #      USER liquibase
  #  depends_on:
  #    postgres:
  #      condition: service_healthy
  #  volumes:
  #    - "./changelog:/liquibase/changelog"
  #  env_file:
  #    - ./dockerconfig/postgres.env
  #  command: sh -c "liquibase --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB} --username=${POSTGRES_USER} --password=${POSTGRES_PASSWORD} --searchPath=/liquibase/changelog --changelog-file=db.changelog.xml update && tail -f /dev/null"
  #  networks:
  #    - cdpnet

  ################################################################################

  redis:
    container_name: "cds-redis"
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    restart: always
    networks:
      - cdpnet

  ################################################################################

  cads-frontend:
    image: defradigital/cads-mis:latest
    ports:
      - "3000:3000"
    depends_on:
      cads-backend:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - ./dockerconfig/defaults.env
      - ./dockerconfig/frontend.env
    networks:
      - cdpnet

  ################################################################################
  
  cads-backend:
    image: defradigital/cads-data-service:0.113.0
    ports:
      - "5555:5555"
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LOCALSTACK_ENDPOINT: "http://localstack:4566"
    env_file:
      - ./dockerconfig/defaults.env
      - ./dockerconfig/backend.env
    healthcheck:
      test: ['CMD', 'curl', 'http://localhost:5555/health']
      interval: 5s
      timeout: 2s
      retries: 30
    networks:
      - cdpnet
  ################################################################################

networks:
  cdpnet:
    driver: bridge